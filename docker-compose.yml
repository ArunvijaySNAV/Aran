# Aran only (core private, cloud public). The bank runs on Vercel; see docs/DEPLOY.md.
services:
  core:
    build: .
    working_dir: /srv/aran-cloud/core
    command: python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --no-proxy-headers
    env_file: [.env.local]
    environment:
      - ARAN_DATA_DIR=/srv/data
    volumes: [aran-data:/srv/data]
    networks: [aran-net]
    expose: ["8000"]            # not published: only the cloud container can reach it
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  cloud:
    build: .
    working_dir: /srv/aran-cloud/cloud
    command: python3 -m uvicorn main:app --host 0.0.0.0 --port 8100 --no-proxy-headers
    env_file: [.env.local]
    environment:
      - ARAN_CORE_URL=http://core:8000
      - ARAN_DEMO_MODE=${ARAN_DEMO_MODE:-0}
      - ARAN_TRUST_CF=${ARAN_TRUST_CF:-0}
      - ARAN_CLOUD_DB=/srv/cloud-data/cloud.db
    ports: ["8100:8100"]
    volumes: [cloud-data:/srv/cloud-data]
    networks: [aran-net]
    depends_on:
      core: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8100/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  aran-net: {}
volumes:
  aran-data: {}
  cloud-data: {}
