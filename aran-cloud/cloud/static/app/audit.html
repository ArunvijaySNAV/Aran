<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Log - Aran Cloud</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/system.css">
</head>
<body>
  <div class="app-shell">
    <aside id="shell-sidebar"></aside>

    <div class="app-main">
      <header id="shell-topbar"></header>

      <main class="app-main-content">
        <div class="container">
          <!-- Page Header -->
          <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-4); border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--space-3);">
            <div>
              <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 4px;">
                <h1 class="page-title">Audit log</h1>
                <span class="pill pill-accent" id="audit-chain-pill">HASH CHAIN VERIFIED</span>
              </div>
              <p class="page-subtitle" style="color: var(--text-muted); font-size: 14px;">
                Cryptographically verifiable detokenise and access audit logs with SHA-256 hash chains
              </p>
            </div>
            <button class="btn btn-secondary btn-sm" id="btn-verify-audit">
              <span>🛡️</span> Verify hash chain
            </button>
          </div>

          <!-- Audit Table -->
          <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr>
                    <th>Timestamp</th>
                    <th>Token Fingerprint</th>
                    <th>Requester Key</th>
                    <th>Purpose</th>
                    <th>Result</th>
                    <th style="text-align: right;">Chain Hash</th>
                  </tr>
                </thead>
                <tbody id="audit-table-body">
                  <tr>
                    <td colspan="6" class="table-empty">Loading detokenise audit log...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app/shell.js"></script>
  <script>
    Shell.init('audit');

    async function loadAudit() {
      try {
        const res = await fetch('/v1/audit', {
          headers: { 'X-API-Key': Shell.getKey() }
        });
        if (!res.ok) return;
        const data = await res.json();
        const tbody = document.getElementById('audit-table-body');
        const rows = data.audit || [];
        if (rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="table-empty">No detokenise accesses recorded yet. Plaintext reads remain zero.</td></tr>';
          return;
        }

        tbody.innerHTML = rows.map(r => {
          return `
            <tr>
              <td class="mono" style="color: var(--text-muted);">${r.at ? r.at.substring(11, 19) : '--:--:--'}</td>
              <td class="mono" style="color: var(--token-green-text);">${r.token_masked || r.token_preview || '...'}</td>
              <td class="mono">${r.key_prefix || 'aran_live_...'}</td>
              <td><span class="pill pill-neutral">${r.purpose || 'Audit'}</span></td>
              <td><span class="pill pill-green">${r.result || 'ok'}</span></td>
              <td class="mono num" style="font-size: 12px; color: var(--text-faint);">${(r.chain_hash || '').substring(0, 16)}...</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('btn-verify-audit').addEventListener('click', async () => {
      try {
        const res = await fetch('/v1/audit/verify', {
          headers: { 'X-API-Key': Shell.getKey() }
        });
        const data = await res.json();
        if (data.valid) {
          Shell.toast('Audit Verified', `Hash chain valid across ${data.entries || 0} entries. Zero tampering detected.`, 'success');
        } else {
          Shell.toast('Audit Warning', data.message || 'Chain verification inconclusive.', 'warning');
        }
      } catch (e) {
        Shell.toast('Error', 'Failed to verify hash chain.', 'error');
      }
    });

    loadAudit();
  </script>
</body>
</html>
