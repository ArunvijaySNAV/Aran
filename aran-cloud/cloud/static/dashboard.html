<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard: Aran Cloud</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/console.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<main id="signin" class="auth" hidden>
  <div class="card">
    <a class="brand" href="/" style="margin-bottom:12px"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 4L8 10V22C8 32.5 14.8 42.1 24 44C33.2 42.1 40 32.5 40 22V10L24 4Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M17 34V23C17 19.134 20.134 16 24 16C27.866 16 31 19.134 31 23V34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="24" r="2" fill="currentColor"/></svg>Aran</a>
    <h1 style="font-size:1.5rem">Sign in to your workspace</h1>
    <p class="muted">Paste your dashboard or admin key. It stays in this browser tab and is never put in a URL.</p>
    <form id="signin-form" novalidate>
      <div class="field"><label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="aran_live_…" required><div class="hint" id="key-err" role="alert"></div></div>
      <button class="btn primary" type="submit" style="width:100%">Open dashboard</button>
    </form>
    <p class="small muted" style="margin:16px 0 0">No workspace yet? <a href="/signup">Create one</a>. <button class="btn sm" data-theme-btn type="button" aria-label="Toggle dark mode" style="margin-left:8px">◐</button></p>
  </div>
</main>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="Workspace">
    <a class="brand" href="/"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 4L8 10V22C8 32.5 14.8 42.1 24 44C33.2 42.1 40 32.5 40 22V10L24 4Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M17 34V23C17 19.134 20.134 16 24 16C27.866 16 31 19.134 31 23V34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="24" r="2" fill="currentColor"/></svg>Aran</a>
    <nav id="nav" aria-label="Sections" style="display:contents"></nav>
    <div class="foot">
      <button class="btn sm" data-theme-btn type="button" aria-label="Toggle dark mode">◐</button>
      <button class="btn sm" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header>
      <div><h1 id="view-title" tabindex="-1">Overview</h1><div class="small muted" id="ws-line"></div></div>
      <div class="row" id="health" aria-live="polite"></div>
    </header>
    <div id="view" role="region" aria-labelledby="view-title"></div>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div id="dlg-body"></div></dialog>

<script src="/static/js/console.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
