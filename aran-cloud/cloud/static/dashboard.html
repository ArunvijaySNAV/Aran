<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard: Aran Cloud</title>
<link rel="preload" href="/static/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/system.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<main id="signin" class="auth" hidden>
  <div class="card">
    <a class="brand" href="/" style="margin-bottom:12px"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 36V19a15 15 0 0 1 30 0v17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M11 36V20a9 9 0 0 1 18 0v16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M17 36V21a3 3 0 0 1 6 0v15" fill="currentColor"/></svg>Aran</a>
    <h1 style="font-size:1.5rem">Sign in to your workspace</h1>
    <p class="muted">Paste your dashboard or admin key. It stays in this browser tab and is never put in a URL.</p>
    <form id="signin-form" novalidate>
      <div class="field"><label for="key">API key</label><input id="key" type="password" autocomplete="off" placeholder="aran_live_…" required><div class="hint" id="key-err" role="alert"></div></div>
      <button class="btn primary" type="submit" style="width:100%">Open dashboard</button>
    </form>
    <p class="small muted" style="margin:16px 0 0">No workspace yet? <a href="/signup">Create one</a>. <button class="btn sm" data-theme-btn type="button" aria-label="Toggle dark mode" style="margin-left:8px">◐</button></p>
  </div>
</main>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="Workspace">
    <a class="brand" href="/"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 36V19a15 15 0 0 1 30 0v17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M11 36V20a9 9 0 0 1 18 0v16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M17 36V21a3 3 0 0 1 6 0v15" fill="currentColor"/></svg>Aran</a>
    <nav id="nav" aria-label="Sections" style="display:contents"></nav>
    <div class="foot">
      <button class="btn sm" data-theme-btn type="button" aria-label="Toggle dark mode">◐ Night</button>
      <button class="btn sm" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header>
      <div><h1 id="view-title" tabindex="-1">Overview</h1><div class="small muted" id="ws-line"></div></div>
      <div class="row" id="health" aria-live="polite"></div>
    </header>
    <div id="view" role="region" aria-labelledby="view-title"></div>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div id="dlg-body"></div></dialog>

<script src="/static/js/console.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
